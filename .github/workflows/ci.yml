name: CI

on:
  push:
    branches: [main, integracao-backend]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (API + worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Mesmas portas do docker-compose local, para o .env.test funcionar sem alterações
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdt
          POSTGRES_PASSWORD: pdt
          POSTGRES_DB: pontodaterra_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pdt -d pontodaterra_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint (sem o tipo any)
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes (Jest + Supertest, inclui concorrência do checkout com 50 compradores)
        run: npm test -- --ci

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint -- src

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3333/api

  imagens:
    name: Imagens Docker (API + worker e site)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem da API e do worker
        run: docker build -t ponto-da-terra-api:ci backend

      - name: Construir a imagem do site
        run: docker build -t ponto-da-terra-web:ci .

      - name: Subir a pilha completa e conferir a saúde da API
        working-directory: backend
        run: |
          docker compose -f docker-compose.completo.yml up -d postgres redis api worker
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3333/api/health; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.completo.yml logs
          exit 1

      - name: Derrubar a pilha
        if: always()
        working-directory: backend
        run: docker compose -f docker-compose.completo.yml down -v
